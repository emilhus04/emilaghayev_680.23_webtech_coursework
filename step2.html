<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="progress-bar">
            <div class="step">1. Личные данные</div>
            <div class="step active">2. Академические данные</div>
        </div>

        <form id="step2-form">
            <h2>Образование</h2>
            
            <div class="form-group">
                <label for="faculty">Выберите факультет *</label>
                <select id="faculty" required>
                    <option value="">-- Не выбран --</option>
                    <option value="it">Информационные технологии</option>
                    <option value="economics">Экономика и менеджмент</option>
                    <option value="design">Дизайн и архитектура</option>
                    <option value="oil">Нефтегазовая промышленность</option>
                    <option value="analytics">Аналитика</option>
                </select>
            </div>

            <div class="form-group">
                <label for="diploma">Сканирование аттестата/диплома (PDF, JPG) *</label>
                <input type="file" id="diploma" accept=".pdf, .jpg, .jpeg" required>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="terms" required> 
                    Я согласен с условиями обработки данных
                </label>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn-next" style="background:#6c757d" onclick="location.href='step1.html'">Назад</button>
                <button type="submit" class="btn-next">Завершить</button>
            </div>
        </form>
    </div>
    <script src="state.js"></script>
</body>
</html>
