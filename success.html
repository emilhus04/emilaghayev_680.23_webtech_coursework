<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успешная регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="text-align: center;">
        <div style="font-size: 50px; color: #28a745;">✔</div>
        <h1>Заявка принята!</h1>
        <p>Уважаемый(ая) <strong id="userName">Студент</strong>, ваша регистрация прошла успешно.</p>
        <p>Номер вашей заявки: <strong>#<span id="appId"></span></strong></p>
        <button class="btn-next" onclick="sessionStorage.clear(); location.href='index.html'">На главную</button>
    </div>

    <script>
        const data = JSON.parse(sessionStorage.getItem('studentData'));
        if (data) {
            document.getElementById('userName').textContent = data.fullName;
            document.getElementById('appId').textContent = Math.floor(Math.random() * 100000);
        }
    </script>
</body>
</html>
